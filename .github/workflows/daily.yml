name: daily-culture-collect
on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python afterplay-collector/collect.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - run: |
          git config user.name "afterplay-bot"
          git config user.email "afterplay-bot@users.noreply.github.com"
          git add docs
          git commit -m "daily update" || echo "변경 없음"
          git push
